  <!-- 아래에서 올라오는 시트 -->
  <div class="sheetbg" id="sheetBg" hidden></div>
  <div class="sheet" id="shHello" hidden role="dialog" aria-label="인사">
    <p class="sht">손시에게 인사하기</p>
    <div class="shrow"><button type="button" class="bigbtn" id="sayNight">잘 자</button><button type="button" class="bigbtn" id="sayMorning">잘 잤어?</button></div>
    <p class="hint">꿈빛 모으기는 아직 준비 중이오.</p>
  </div>
  <div class="sheet" id="shFruit" hidden role="dialog" aria-label="꿈열매">
    <p class="sht">꿈열매</p>
    <div class="ph wide"><em>덩이 그림 자리</em></div>
    <p class="hint">아직 열매가 맺히지 않았소.</p>
    <button type="button" class="bigbtn" disabled>수확하기</button>
  </div>
  <div class="sheet" id="shRename" hidden role="dialog" aria-label="손시 이름 바꾸기">
    <p class="sht">손시 이름 바꾸기</p>
    <div class="namerow"><input id="renameIn" type="text" maxlength="12" placeholder="이름을 지어 주시오." aria-label="새 이름" autocomplete="off" spellcheck="false" enterkeyhint="done">
      <button type="button" class="namedice" id="renameDice" aria-label="랜덤 이름"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="8.5" r="1.4" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.4" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.4" fill="currentColor"/></svg></button></div>
    <p class="hint">한글은 여덟 자, 영문은 열두 자까지 되오.</p>
    <button type="button" class="bigbtn" id="renameSave">저장</button>
  </div>
  <div class="sheet" id="shReset" hidden role="dialog" aria-label="처음부터 다시 만들기">
    <p class="sht">처음부터 다시 만들겠소?</p>
    <p class="hint">지금 손시와 이름, 꾸민 모습이 모두 지워지고 꿈알부터 다시 시작하오.</p>
    <div class="shrow"><button type="button" class="ghostbtn" data-close>그만두기</button><button type="button" class="bigbtn warnbtn" id="resetGo">다시 만들기</button></div>
  </div>
  <div class="sheet" id="shResult" hidden role="dialog" aria-label="스테이지 결과">
    <p class="sht" id="resTitle">다 풀었소!</p>
    <div class="rstars" id="resStars" aria-label="별"></div>
    <p class="tline" id="resLine"></p>
    <p class="hint" id="resGain"></p>
    <div class="shrow"><button type="button" class="ghostbtn" id="resAgain">다시 하기</button><button type="button" class="bigbtn" id="resNext">계속</button></div>
  </div>
  <div class="sheet" id="shGift" hidden role="dialog" aria-label="선물 상자">
    <p class="sht">선물 상자</p>
    <div class="giftbig" aria-hidden="true"><i></i></div>
    <p class="hint" id="giftText"></p>
    <button type="button" class="bigbtn" data-close>받기</button>
  </div>
  <div class="sheet" id="shSoon" hidden role="dialog" aria-label="준비 중">
    <p class="sht">아직 짓는 중이오…</p>
    <p class="hint">곧 열 테니 조금만 기다려 주시오.</p>
    <button type="button" class="ghostbtn" data-close>닫기</button>
  </div>

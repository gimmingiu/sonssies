<!-- 인트로(스플래시): 홈 화면 앱으로 열 때만. 주소에 ?intro 를 붙이면 브라우저에서도 보임 -->
<style>
#intro{position:fixed;inset:0;z-index:9999;background:#fff;display:grid;place-items:center;overflow:hidden}
#intro .iz{will-change:transform;transform-origin:50% 70%;animation:inPop .32s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes inPop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}   /* 커질 때 기준점을 가운데보다 아래에 둬서 위쪽으로 확 튀어나오듯 */
#intro .ib{position:relative;width:165px;aspect-ratio:330/171;transform-origin:50% 100%;animation:inBounce .66s linear infinite .3s;will-change:transform}
#intro .ib img{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:transform}
#intro .el{transform-origin:23.34% 59.42%;animation:inEarL .66s linear infinite .3s}
#intro .er{transform-origin:76.66% 59.42%;animation:inEarR .66s linear infinite .3s}
#intro .ih{animation:inHorn .66s linear infinite .3s}
/* 한 번 튀는 주기(.66초): 바닥 → 찌그러짐 → 늘어나며 도약 → 꼭대기 → 착지. 처음과 끝이 같아 이음매 없음 */
@keyframes inBounce{
  0%{transform:translateY(0) scale(1,1);animation-timing-function:cubic-bezier(.3,0,.7,1)}
  10%{transform:translateY(0) scale(1.09,.91);animation-timing-function:cubic-bezier(.3,0,.7,1)}
  20%{transform:translateY(-4px) scale(.96,1.04);animation-timing-function:cubic-bezier(.15,.55,.45,1)}
  55%{transform:translateY(-36px) scale(1,1);animation-timing-function:cubic-bezier(.55,0,.85,.45)}
  92%{transform:translateY(-1px) scale(.97,1.03);animation-timing-function:cubic-bezier(.3,0,.7,1)}
  100%{transform:translateY(0) scale(1,1)}}
/* 귀: 머리보다 한 박자 늦게 따라옴. 뛰어오를 땐 끝이 처지고, 떨어질 땐 떠오르고, 착지해 찌그러질 땐 위로 튕김 */
@keyframes inEarL{
  0%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.2,.6,.4,1)}
  12%{transform:rotate(15deg);animation-timing-function:cubic-bezier(.5,0,.5,1)}
  38%{transform:rotate(-13deg);animation-timing-function:cubic-bezier(.5,0,.5,1)}
  60%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.5,0,.5,1)}
  88%{transform:rotate(5deg);animation-timing-function:cubic-bezier(.5,0,.5,1)}
  100%{transform:rotate(0deg)}}
@keyframes inEarR{
  0%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.2,.6,.4,1)}
  12%{transform:rotate(-15deg);animation-timing-function:cubic-bezier(.5,0,.5,1)}
  38%{transform:rotate(13deg);animation-timing-function:cubic-bezier(.5,0,.5,1)}
  60%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.5,0,.5,1)}
  88%{transform:rotate(-5deg);animation-timing-function:cubic-bezier(.5,0,.5,1)}
  100%{transform:rotate(0deg)}}
/* 뿔: 단단하니까 같은 방향으로 아주 조금만 */
@keyframes inHorn{
  0%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.6,.4,1)}
  12%{transform:translateY(-2.5px);animation-timing-function:cubic-bezier(.5,0,.5,1)}
  38%{transform:translateY(2px);animation-timing-function:cubic-bezier(.5,0,.5,1)}
  60%{transform:translateY(.5px);animation-timing-function:cubic-bezier(.5,0,.5,1)}
  88%{transform:translateY(-1px);animation-timing-function:cubic-bezier(.5,0,.5,1)}
  100%{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){#intro .iz,#intro .ib,#intro .ib img{animation:none}}
</style>

<script>
(function(){
  var el=document.getElementById('intro');
  var app=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  if(!app&&!/[?&#]intro\b/.test(location.search+location.hash)){el.remove();window.__dkIntroReady=function(){};return}
  // 시작 화면 이미지(아이폰이 앱을 켤 때 먼저 보여주는 그림)와 같은 자리에 오도록: 상태바 높이의 절반만큼 위로
  var sb=Math.max(0,(screen.height||innerHeight)-innerHeight);if(sb>0&&sb<80)el.style.paddingBottom=sb+'px';
  var tc=[].slice.call(document.querySelectorAll('meta[name=theme-color]')),tc0=tc.map(function(m){return m.content});
  tc.forEach(function(m){m.content='#ffffff'});
  function restoreTC(){tc.forEach(function(m,i){m.content=tc0[i]})}
  var started=false,iz=el.firstChild,ib=iz.firstChild,T=660,JUMPS=3,OUT=820;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function done(){restoreTC();if(el.parentNode)el.remove()}
  // 끝내기: 최소 3번 튄 뒤, 지금 튀는 한 번이 바닥에 닿는 순간 모든 부분(머리·귀·뿔)을 함께 멈추고(브라우저 애니메이션 시간표 기준)
  // 그 순간부터 살짝 작아졌다가 화면 밖까지 커지며 흰 배경이 사라짐 → 중간에 끊기지 않음
  function finish(){
    if(started)return;started=true;
    var all=el.getAnimations?el.getAnimations({subtree:true}):[],b=ib.getAnimations?ib.getAnimations()[0]:null;
    if(reduce||!b||!iz.animate){el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(done,350);return}
    var ct=(b.currentTime||0)-300,n=Math.max(JUMPS,Math.floor(Math.max(0,ct)/T)+1),wait=n*T-ct;   // 처음 .3초는 나타나는 동작(튀기 전)
    if(wait<120){n++;wait+=T}           // 바닥이 너무 가까우면 한 번 더 튀고 끝냄
    all.forEach(function(a){a.effect.updateTiming({iterations:n,fill:'forwards'})});
    iz.animate([{transform:'translateY(0) scale(1)',easing:'cubic-bezier(.3,0,.5,1)'},{transform:'translateY(5px) scale(.8)',offset:.3,easing:'cubic-bezier(.65,0,.9,.55)'},{transform:'translateY(-40px) scale(26)'}],{duration:OUT,delay:wait,fill:'forwards'});
    var f=el.animate([{opacity:1},{opacity:1,offset:.5},{opacity:0}],{duration:OUT,delay:wait,easing:'ease-in',fill:'forwards'});
    f.onfinish=done;setTimeout(done,wait+OUT+500);
  }
  // 3D가 준비되면, 첫 화면을 그리느라 바빴던 브라우저가 다시 부드럽게 돌기 시작할 때까지 잠깐 기다렸다가 끝냄
  function whenSmooth(cb){var last=0,ok=0,t1=performance.now();
    function f(now){if(last)ok=(now-last)<34?ok+1:0;last=now;if(ok>=20||now-t1>2500)cb();else requestAnimationFrame(f)}requestAnimationFrame(f)}
  window.__dkIntroReady=function(){whenSmooth(finish)};
  setTimeout(finish,8000);   // 혹시 3D가 늦어도 8초 뒤엔 넘어감
})();
</script>
